<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>DBDA-R Candidate Self-Test</title>
<style>

:root{
  --ink:#1a1a2e; --paper:#fbfaf6; --panel:#ffffff; --line:#d8d4c8;
  --accent:#8b2f2f; --accent2:#1f5a4a; --warn:#b8860b; --danger:#b8281f;
  --muted:#6b6a63; --lock:#e9e6da;
  font-size:18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;}
body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);}
h1,h2,h3{font-family:'Trebuchet MS',Helvetica,Arial,sans-serif;margin:.2em 0;}
button{font-family:'Trebuchet MS',Helvetica,Arial,sans-serif;font-size:1rem;padding:.55em 1.1em;border-radius:6px;border:1px solid var(--ink);background:var(--panel);cursor:pointer;}
button.primary{background:var(--accent2);color:#fff;border-color:var(--accent2);}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
button:disabled{opacity:.45;cursor:not-allowed;}
select,input[type=text],input[type=number],input[type=date],textarea{font-size:1rem;padding:.4em;border:1px solid var(--line);border-radius:5px;font-family:inherit;}
.flag{display:inline-block;background:var(--danger);color:#fff;font-size:.7rem;font-weight:bold;padding:2px 8px;border-radius:10px;font-family:'Trebuchet MS',sans-serif;letter-spacing:.03em;vertical-align:middle;margin-left:.4em;}
.flag.warn{background:var(--warn);}
.topbar{background:var(--ink);color:#fff;padding:.6em 1em;display:flex;justify-content:space-between;align-items:center;font-family:'Trebuchet MS',sans-serif;position:sticky;top:0;z-index:50;}
.topbar b{font-size:1.05rem;}
.wrap{max-width:1000px;margin:0 auto;padding:1em;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.2em 1.4em;margin-bottom:1em;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1em;}
@media (max-width:700px){.two-col{grid-template-columns:1fr;}}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.2em;font-family:'Trebuchet MS',sans-serif;}
.field{margin-bottom:.9em;}
.field input,.field select{width:100%;}
.timer{font-family:'Courier New',monospace;font-size:2.2rem;font-weight:bold;text-align:center;padding:.2em;border:2px solid var(--ink);border-radius:8px;background:#fff;}
.timer.low{color:var(--danger);border-color:var(--danger);}
.progress{height:8px;background:var(--lock);border-radius:4px;overflow:hidden;margin:.5em 0;}
.progress > div{height:100%;background:var(--accent2);transition:width .3s;}
.item-block{border:1px solid var(--line);border-radius:8px;padding:.8em 1em;margin-bottom:.8em;background:#fff;}
.item-block.locked{opacity:.5;pointer-events:none;}
.options{display:flex;flex-wrap:wrap;gap:.6em;margin-top:.4em;}
.opt{border:1px solid var(--line);border-radius:6px;padding:.4em .8em;cursor:pointer;user-select:none;}
.opt.selected{background:var(--accent2);color:#fff;border-color:var(--accent2);}
.opt input{display:none;}
.sd-opts{display:flex;gap:.6em;}
.sd-opts .opt{min-width:3.2em;text-align:center;font-weight:bold;}
.examiner-script{background:#fff8e6;border:1px dashed var(--warn);border-radius:8px;padding:1em;font-style:italic;margin:1em 0;}
.locked-screen{text-align:center;padding:3em 1em;}
.locked-screen h2{font-size:1.6rem;}
.rest-count{font-size:3rem;font-family:'Courier New',monospace;text-align:center;}
.table-scroll{overflow-x:auto;}
table{border-collapse:collapse;width:100%;}
th,td{border:1px solid var(--line);padding:.4em .6em;text-align:center;font-size:.92rem;}
th{background:var(--ink);color:#fff;font-family:'Trebuchet MS',sans-serif;}
.controls-row{display:flex;gap:.6em;flex-wrap:wrap;margin-top:.7em;}
.subtest-list{list-style:none;padding:0;margin:0;}
.subtest-list li{display:flex;align-items:center;gap:.6em;padding:.4em .6em;border:1px solid var(--line);border-radius:6px;margin-bottom:.35em;background:#fff;font-family:'Trebuchet MS',sans-serif;}
.subtest-list li.done{background:#eef6ef;}
.subtest-list li.current{border-color:var(--accent2);border-width:2px;}
.subtest-list li .badge{font-size:.7rem;padding:1px 6px;border-radius:8px;background:var(--lock);}
.ca-item{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:.8rem 1rem;align-items:start;background:linear-gradient(180deg,#fff,#fbfcfa);border:1px solid var(--line);border-radius:14px;padding:1rem 1rem 1.05rem;margin:0 0 .9rem;box-shadow:0 4px 16px rgba(20,35,30,.045);transition:border-color .15s,box-shadow .15s;}
.ca-item:hover{border-color:#b8c8bf;box-shadow:0 6px 20px rgba(20,35,30,.07);}
.ca-item.locked{background:#fafbf9;}
.ca-num{font-family:'Trebuchet MS',sans-serif;font-weight:700;font-size:1rem;color:var(--muted);background:#eef3ef;border-radius:10px;min-width:2.35rem;height:2.35rem;display:flex;align-items:center;justify-content:center;}
.ca-imgwrap{grid-column:2;background:#fff;border:1px solid #e8ece9;border-radius:10px;min-height:82px;padding:.75rem 1rem;display:flex;align-items:center;justify-content:flex-start;overflow:hidden;}
.ca-img{display:block;width:auto;max-width:100%;max-height:125px;height:auto;object-fit:contain;image-rendering:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
.ca-opts{grid-column:2;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.55rem;margin-top:.1rem;}
.ca-opt{color:var(--ink);min-width:0;text-align:center;font-size:1rem;font-weight:600;letter-spacing:.01em;padding:.72rem .45rem;border:1px solid #d9e0dc;border-radius:10px;background:#fff;cursor:pointer;transition:all .15s;}
.ca-opt:hover{border-color:#9caf9f;background:#f7faf7;}
.ca-opt.selected{border-color:var(--accent2);background:#edf5ef;box-shadow:inset 0 0 0 1px var(--accent2);}
.ca-opt input{margin-right:.35rem;accent-color:var(--accent2);}
.ca-flag{grid-column:2;}
.ca-progress{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 1rem;margin:0 0 1rem;background:#f3f7f4;border:1px solid #dbe5df;border-radius:12px;font-size:.9rem;}
.ca-progress strong{font-size:1rem;color:var(--ink);}
.ca-instruction-note{padding:.85rem 1rem;margin:0 0 1rem;background:#f7f4ea;border:1px solid #e5ddc7;border-radius:12px;font-size:.9rem;line-height:1.5;}
@media (max-width:760px){.ca-item{grid-template-columns:2.6rem minmax(0,1fr);padding:.8rem;}.ca-imgwrap,.ca-opts,.ca-flag{grid-column:2;}.ca-opts{grid-template-columns:repeat(2,minmax(0,1fr));}.ca-opt{font-size:.95rem;}.ca-img{max-height:105px;}}
.instr-page{max-width:820px;margin:0 auto;font-size:1.05rem;line-height:1.5;}
.instr-page .wait-line{text-align:center;margin-top:1.5em;}
@media (max-width:760px){.ca-opts{flex-wrap:wrap;}.ca-opt{flex:1 1 40%;}}
.footer-note{font-size:.72rem;color:var(--muted);text-align:center;margin-top:2em;padding:1em 0;font-family:'Trebuchet MS',sans-serif;}
.candidate-view{user-select:none;-webkit-user-select:none;}
.role-picker{display:flex;gap:1em;justify-content:center;padding:3em 1em;}
.role-picker .card{cursor:pointer;text-align:center;width:220px;}
.role-picker .card:hover{border-color:var(--accent2);}
.notice{background:#fdeeee;border:1px solid var(--danger);border-radius:8px;padding:.8em 1em;margin-bottom:1em;font-size:.9rem;}
.notice.info{background:#eef3fb;border-color:#2c5a8b;}
textarea.notefield{width:100%;min-height:4em;}
.examiner-panel-grid{display:grid;grid-template-columns:2fr 1fr;gap:1em;}
@media (max-width:900px){.examiner-panel-grid{grid-template-columns:1fr;}}
.mini-note{font-size:.78rem;color:var(--muted);}
.svg-graph{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;}
.source-page{display:block;width:100%;max-width:1050px;height:auto;margin:.7em auto;border:1px solid var(--line);background:#fff;}
.sa-img{display:block;width:100%;height:auto;border:1px solid var(--line);background:#fff;}
@media(max-width:760px){.source-page{max-width:100%;}.sa-img{max-width:100%;}}

/* ===== PROFESSIONAL RESPONSIVE ASSESSMENT UI ===== */
:root{--header-h:58px;--content-max:1180px;--touch:44px;--surface:#fff;--surface-2:#f5f7f6;--focus:#2d6a5a;}
html{font-size:16px;scroll-behavior:smooth;}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45;overflow-x:hidden;background:#f4f6f5;}
.topbar{min-height:var(--header-h);padding:max(.55rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) .55rem max(1rem,env(safe-area-inset-left));gap:.75rem;box-shadow:0 1px 0 rgba(0,0,0,.12);}
.topbar b{font-size:.95rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wrap{width:min(100% - 2rem,var(--content-max));padding:1rem 0 2rem;}
.card{border-radius:12px;padding:1.15rem;margin-bottom:1rem;box-shadow:0 1px 2px rgba(0,0,0,.035);min-width:0;}
.two-col,.examiner-panel-grid{min-width:0;}
button{min-height:var(--touch);touch-action:manipulation;}
button:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(45,106,90,.28);outline-offset:2px;}
input,select,textarea{min-height:var(--touch);max-width:100%;}
.controls-row{align-items:center;}
.item-block,.ca-item,.source-sheet,.response-row{min-width:0;overflow:hidden;}
img{max-width:100%;}
/* Persistent assessment status bar: never disappears while a timed test is active. */
.assessment-status{position:sticky;top:var(--header-h);z-index:40;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:.75rem;background:#101820;color:#fff;border-radius:0 0 12px 12px;padding:.55rem .75rem;margin:0 0 1rem;box-shadow:0 5px 16px rgba(0,0,0,.12);}
.assessment-status .status-title{min-width:0;font-weight:750;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.assessment-status .status-meta{text-align:right;font-size:.75rem;opacity:.8;white-space:nowrap;}
.assessment-status .status-timer{font:800 1.15rem/1 "SFMono-Regular",Consolas,"Liberation Mono",monospace;letter-spacing:.04em;background:#fff;color:#101820;border-radius:8px;padding:.5rem .7rem;min-width:5.5rem;text-align:center;}
.assessment-status .status-timer.low{color:var(--danger);box-shadow:inset 0 0 0 2px var(--danger);}
.assessment-status .status-progress{grid-column:1/-1;height:4px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;}
.assessment-status .status-progress>div{height:100%;background:#6db89d;width:0;}
.timer{position:sticky;top:calc(var(--header-h) + 4rem);z-index:30;font-size:1.65rem;padding:.5rem;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.09);}
.role-picker{flex-wrap:wrap;min-height:60vh;align-items:center;}
.role-picker .card{width:min(320px,100%);min-height:160px;display:flex;flex-direction:column;justify-content:center;}
.source-stack{min-width:0;}
.source-sheet img,.source-page,.sa-img{max-height:none;object-fit:contain;}
.ca-imgwrap{min-width:0;}
.ca-img{max-width:100%;}
@media(max-width:700px){
  :root{--header-h:52px;}
  .wrap{width:min(100% - 1rem,100%);padding:.65rem 0 1.25rem;}
  .topbar{padding:.45rem .6rem;}
  .topbar .no-print{font-size:.78rem;padding:.35rem .55rem;min-height:38px;}
  .card{padding:.85rem;border-radius:10px;}
  .assessment-status{grid-template-columns:minmax(0,1fr) auto;gap:.45rem;padding:.45rem .55rem;margin-bottom:.7rem;}
  .assessment-status .status-meta{display:none;}
  .assessment-status .status-timer{font-size:1rem;min-width:4.8rem;padding:.42rem .5rem;}
  .assessment-status .status-progress{grid-column:1/-1;}
  .timer{top:calc(var(--header-h) + 3.25rem);font-size:1.35rem;}
  .options{gap:.45rem;}
  .opt{min-height:var(--touch);display:flex;align-items:center;}
  .response-grid{grid-template-columns:1fr;}
  .response-buttons button{min-width:var(--touch);}
  .source-sheet{padding:.35rem;}
  .source-sheet-actions{position:sticky;bottom:.5rem;z-index:10;}
}
@media(min-width:701px){
  .candidate-view,.examiner-panel-grid{min-width:0;}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important;}}

@media print{
  .no-print{display:none !important;}
  body{font-size:12pt;background:#fff;}
  .card{border:1px solid #999;page-break-inside:avoid;}
  .topbar{position:static;}
}

/* ===== Source-page architecture / examiner UI v2 ===== */
.source-stack{margin:1rem 0 1.2rem;}
.source-stack-header{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.7rem;}
.source-stack-title{font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-weight:800;letter-spacing:.02em;color:var(--ink);}
.source-stack-subtitle{font-size:.8rem;color:var(--muted);}
.source-sheet{background:#fff;border:1px solid #d7d4ca;border-radius:6px;padding:.55rem;margin:0 0 1.1rem;box-shadow:0 3px 12px rgba(20,25,20,.08);}
.source-sheet-label{font:600 .78rem/1.35 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--muted);padding:.15rem .25rem .45rem;text-transform:uppercase;letter-spacing:.05em;}
.source-sheet img{display:block;width:100%;height:auto;max-width:1050px;margin:0 auto;background:#fff;border:1px solid #eee;cursor:zoom-in;}
.source-sheet-actions{display:flex;justify-content:flex-end;margin-top:.45rem;}
.source-sheet-actions button{font-size:.82rem;padding:.35rem .7rem;}
.examiner-responses{margin-top:1rem;}
.examiner-responses>h3{margin:.2rem 0 .55rem;}
.response-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.55rem;}
.response-row{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:.55rem;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;padding:.45rem .55rem;}
.response-num{font:700 .9rem/1 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--muted);text-align:center;}
.response-buttons{display:flex;flex-wrap:wrap;gap:.3rem;}
.response-buttons button{min-width:2.6rem;padding:.42rem .55rem;}
.response-buttons button.selected{background:var(--accent2);color:#fff;border-color:var(--accent2);font-weight:800;box-shadow:0 0 0 2px rgba(31,90,74,.12);}
.sticky-exam-nav{position:sticky;top:3.05rem;z-index:40;margin:0 0 1rem;background:rgba(251,250,246,.97);backdrop-filter:blur(8px);border:1px solid #d7d4ca;border-radius:12px;padding:.65rem .75rem;box-shadow:0 5px 18px rgba(20,25,20,.08);}
.sticky-exam-nav .nav-top{display:flex;justify-content:space-between;align-items:center;gap:.7rem;flex-wrap:wrap;}
.sticky-exam-nav .nav-title{font:800 .95rem/1.2 system-ui,-apple-system,Segoe UI,sans-serif;}
.sticky-exam-nav .nav-count{font:700 .82rem/1.2 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--muted);}
.sticky-exam-nav .nav-buttons{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.5rem;}
.sticky-exam-nav .nav-buttons button{font-size:.78rem;padding:.35rem .5rem;}
.sticky-exam-nav .nav-buttons button.current{background:var(--accent2);color:#fff;border-color:var(--accent2);}
.source-modal{position:fixed;inset:0;z-index:1000;background:rgba(15,20,18,.82);display:none;align-items:center;justify-content:center;padding:1rem;}
.source-modal.open{display:flex;}
.source-modal-panel{width:min(96vw,1250px);height:min(94vh,1100px);background:#f5f4ef;border-radius:12px;border:1px solid #cfcac0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.source-modal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.55rem .7rem;background:var(--ink);color:#fff;flex-wrap:wrap;}
.source-modal-toolbar .zoom-actions{display:flex;gap:.3rem;flex-wrap:wrap;}
.source-modal-toolbar button{font-size:.8rem;padding:.35rem .6rem;}
.source-modal-body{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:1rem;background:#777;}
.source-modal-body img{width:auto;max-width:none;height:auto;display:block;transform-origin:top center;background:#fff;box-shadow:0 5px 20px rgba(0,0,0,.2);}
.source-ref-card{margin-top:1rem;}
@media(max-width:760px){
  .source-sheet{padding:.35rem;}
  .response-grid{grid-template-columns:1fr;}
  .sticky-exam-nav{top:2.8rem;}
}
@media print{
  .sticky-exam-nav,.source-sheet-actions,.source-modal{display:none!important;}
  .source-sheet{box-shadow:none;page-break-inside:avoid;}
}


.connection-status{display:inline-flex;align-items:center;gap:.35rem;font:700 .78rem/1 system-ui,-apple-system,Segoe UI,sans-serif;white-space:nowrap;}
.connection-dot{font-size:.75rem;line-height:1;}
.connection-status.online{color:#1f5a4a;}
.connection-status.offline{color:#8a6d2b;}
.connection-status.online .connection-dot{color:#1f5a4a;}
.connection-status.offline .connection-dot{color:#8a6d2b;}
.connection-mode{font-size:.65rem;letter-spacing:.08em;color:var(--muted);padding:.18rem .35rem;border:1px solid var(--line);border-radius:999px;}
.topbar-actions{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;}
.connection-card{border-left:4px solid var(--accent2);}
.connection-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.session-code-box{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-top:.7rem;padding:.7rem .85rem;background:#f4f2ea;border:1px dashed #bdb8aa;border-radius:9px;}
.session-code-box strong{font:900 1.45rem/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.18em;color:var(--accent2);}
.candidate-connect{max-width:620px;margin:2rem auto;text-align:center;}
.dbda-mark{font:900 .85rem/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.16em;color:var(--accent2);margin-bottom:1rem;}
.candidate-code-entry{display:flex;gap:.5rem;max-width:430px;margin:1rem auto;}
.candidate-code-entry input{flex:1;text-align:center;text-transform:uppercase;font:800 1.25rem/1.2 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.16em;}
.connection-status-row{display:flex;align-items:center;justify-content:center;gap:.7rem;flex-wrap:wrap;margin-top:1rem;}
.candidate-live-strip{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.55rem .75rem;margin-bottom:.8rem;border:1px solid #cbd9d1;background:#f1f7f3;border-radius:9px;font:700 .78rem/1.2 system-ui,-apple-system,Segoe UI,sans-serif;color:#1f5a4a;}

.remote-setup{max-width:760px;margin:1rem auto;}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin-top:.8rem;}
.mode-card{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:1rem;background:#fff;}
.mode-card.active{border:2px solid var(--accent2);background:#f5f8f5;}
.mode-card h3{margin:.1rem 0 .35rem;}
.mode-card p{margin:0;color:var(--muted);font-size:.9rem;}
.remote-fields{display:grid;grid-template-columns:1fr;gap:.7rem;margin-top:.9rem;}
.remote-fields input{width:100%;box-sizing:border-box;}
.setup-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;}
.setup-badge{display:inline-flex;align-items:center;gap:.4rem;font-weight:800;font-size:.78rem;}
@media(max-width:760px){.mode-grid{grid-template-columns:1fr;}.remote-setup{margin:.7rem auto;}}
@media(max-width:760px){
  .candidate-connect{margin:1rem auto;}
  .candidate-code-entry{flex-direction:column;}
  .candidate-code-entry button{width:100%;}
  .topbar-actions{width:100%;justify-content:flex-end;}
}
.role-launch{position:relative;z-index:50;pointer-events:auto;touch-action:manipulation;}

</style>
</head>
<body>
<div class="mini-note" style="text-align:center;padding:.35rem;background:#f3f1e8;">
  DBDA-R Candidate Self-Test
</div>

<div id="app">
  <div class="wrap">
    <div class="card">
      <h2>DBDA-R Candidate Assessment</h2>
      <p id="dbda-loader-message">Loading the candidate assessment…</p>
    </div>
  </div>
</div>

<script src="app.js"></script>

<script>
(function(){
  function showLoaderError(error){
    var app=document.getElementById('app');
    var message=error && error.message ? error.message : String(error || 'Unknown error');
    if(app){
      app.innerHTML=
        '<div class="wrap"><div class="card notice">' +
        '<h2>DBDA-R could not start</h2>' +
        '<p>' +
        message.replace(/[<>&]/g,function(m){
          return {'<':'&lt;','>':'&gt;','&':'&amp;'}[m];
        }) +
        '</p>' +
        '<p>Please reload the page. If the problem continues, the Apps Script project files are not complete.</p>' +
        '</div></div>';
    }
  }

  (async function(){
    try{
      var base = 'data/';
      var files = ['key.json','norms.json','groups.json','assets.json','source-pages.json'];
      var results = await Promise.all(files.map(function(name){
        return fetch(base + name).then(function(res){
          if(!res.ok) throw new Error('Failed to load ' + name + ' (HTTP ' + res.status + ')');
          return res.json();
        });
      }));

      var KEY=results[0], NORMS=results[1], SOURCE_GROUPS=results[2],
          ASSETS=results[3], SOURCE_PAGES=results[4];

      if(!KEY || !NORMS) throw new Error('DBDA-R data bundle was empty.');

      bootDBDAApp(
        KEY,
        NORMS,
        SOURCE_GROUPS,
        ASSETS,
        SOURCE_PAGES
      );
    }catch(error){
      showLoaderError(error);
    }
  })();
</script>
</body>
</html>
